  <style>
    :root {

      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      color: #172033;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(26, 77, 136, 0.08), transparent 42%),
        linear-gradient(315deg, rgba(204, 48, 48, 0.07), transparent 40%),
        #f5f7fb;
    }
    main {
      width: min(420px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid rgba(23, 32, 51, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 60px rgba(20, 31, 54, 0.14);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.45rem;
      line-height: 1.2;
    }
    p {
      margin: 0 0 22px;
      color: #536071;
      line-height: 1.45;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 650;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #b9c2cf;
      border-radius: 6px;
      font: inherit;
      background: #fff;
      color: #172033;
    }
    button {
      width: 100%;
      min-height: 44px;
      margin-top: 14px;
      border: 0;
      border-radius: 6px;
      background: #184f90;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }
    #error {
      min-height: 1.4em;
      margin-top: 12px;
      color: #b3261e;
      font-size: 0.92rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        background: #101622;
        color: #ecf2fb;
      }
      body {
        background:
          linear-gradient(135deg, rgba(73, 145, 210, 0.18), transparent 42%),
          linear-gradient(315deg, rgba(230, 87, 87, 0.13), transparent 40%),
          #101622;
      }
      main {
        border-color: rgba(236, 242, 251, 0.18);
        background: rgba(23, 32, 48, 0.94);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.36);

      p {
        color: #b8c4d4;
      }
      input {
        border-color: #526175;
        background: #111927;
        color: #ecf2fb;

  <script>
    (() => {
      "use strict";

      const payload = JSON.parse(document.getElementById("ars-protected-page-data").textContent);
      const form = document.getElementById("unlock-form");
      const passwordInput = document.getElementById("password");
      const unlockButton = document.getElementById("unlock-button");
      const errorBox = document.getElementById("error");
      const storageKey = "arsProtectedPagePassword";
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();

      function setError(message) {
        errorBox.textContent = message;
      }

      function getSavedPassword() {
        try {
          return sessionStorage.getItem(storageKey);
        } catch (_) {
          return null;
        }
      }

      function savePassword(password) {
        try {
          sessionStorage.setItem(storageKey, password);
        } catch (_) {
        }
      }

      function forgetPassword() {
        try {
          sessionStorage.removeItem(storageKey);
        } catch (_) {
        }
      }

      function b64ToBytes(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      async function deriveKey(password, salt) {
        const passwordKey = await crypto.subtle.importKey(
          "raw",
          encoder.encode(password),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt,
            iterations: payload.iterations,
            hash: "SHA-256"
          },
          passwordKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      }

      function restoreAssetUrls(html) {
        const manifest = document.getElementById("ars-protected-page-assets");
        if (!manifest) {
          return html;
        }
        const assetUrls = new Map();
        manifest.content.querySelectorAll("[data-ars-original-url]").forEach((entry) => {
          const original = decoder.decode(b64ToBytes(entry.dataset.arsOriginalUrl));
          const deployed = entry.getAttribute("href");
          // Leave local/offline HTML byte-for-byte unchanged. Only deployment
          // turns these template hrefs into absolute CDN URLs.
          if (deployed.startsWith("https://") || deployed.startsWith("http://")) {
            assetUrls.set(original, deployed.replace(/&/g, "&amp;")
              .replace(/"/g, "&quot;").replace(/'/g, "&#39;"));
          }
        });
        return html.replace(/\b(src|href|poster)=(["'])([^"']*)\2/g,
          (attribute, name, quote, url) => assetUrls.has(url)
            ? name + "=" + quote + assetUrls.get(url) + quote
            : attribute);
      }

      async function unlock(password, rememberPassword) {
        const salt = b64ToBytes(payload.salt);
        const iv = b64ToBytes(payload.iv);
        const ciphertext = b64ToBytes(payload.ciphertext);
        const key = await deriveKey(password, salt);
        const clearBytes = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
        const html = restoreAssetUrls(decoder.decode(clearBytes));
        if (rememberPassword) {
          savePassword(password);
        }
        document.open();
        document.write(html);
        document.close();
      }

      if (!window.crypto || !crypto.subtle) {
        unlockButton.disabled = true;
        setError("Apri la pagina tramite HTTPS o localhost per usare lo sblocco.");
        return;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = passwordInput.value;
        unlockButton.disabled = true;
        setError("");
        try {
          await unlock(password, true);
        } catch (_) {
          forgetPassword();
          unlockButton.disabled = false;
          passwordInput.select();
          setError("Password non valida.");
        }
      });

      const savedPassword = getSavedPassword();
      if (savedPassword) {
        unlock(savedPassword, false).catch(() => forgetPassword());
      }
    })();
  </script>
