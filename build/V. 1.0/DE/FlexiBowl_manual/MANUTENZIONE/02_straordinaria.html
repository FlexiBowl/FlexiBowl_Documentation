      font-weight: 650;
    }

      border: 1px solid #b9c2cf;
      border-radius: 6px;
      font: inherit;
      background: #fff;
      color: #172033;
    }
    button {
      width: 100%;
      min-height: 44px;
      margin-top: 14px;
      border: 0;
      border-radius: 6px;
      background: #184f90;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

      margin-top: 12px;
      color: #b3261e;
      font-size: 0.92rem;
    }

      :root {
        background: #101622;
        color: #ecf2fb;
      }
      body {

          linear-gradient(315deg, rgba(230, 87, 87, 0.13), transparent 40%),
          #101622;
      }
      main {

    (() => {
      "use strict";

      const payload = JSON.parse(document.getElementById("ars-protected-page-data").textContent);
      const form = document.getElementById("unlock-form");
      const passwordInput = document.getElementById("password");
      const unlockButton = document.getElementById("unlock-button");
      const errorBox = document.getElementById("error");
      const storageKey = "arsProtectedPagePassword";
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();

      function setError(message) {
        errorBox.textContent = message;
      }

      function getSavedPassword() {
        try {
          return sessionStorage.getItem(storageKey);
        } catch (_) {
          return null;
        }
      }

      function savePassword(password) {
        try {
          sessionStorage.setItem(storageKey, password);
        } catch (_) {
        }
      }

      function forgetPassword() {
        try {
          sessionStorage.removeItem(storageKey);
        } catch (_) {
        }
      }

      function b64ToBytes(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      async function deriveKey(password, salt) {
        const passwordKey = await crypto.subtle.importKey(
          "raw",
          encoder.encode(password),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt,
            iterations: payload.iterations,
            hash: "SHA-256"
          },
          passwordKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      }

      async function unlock(password, rememberPassword) {
        const salt = b64ToBytes(payload.salt);
        const iv = b64ToBytes(payload.iv);
        const ciphertext = b64ToBytes(payload.ciphertext);
        const key = await deriveKey(password, salt);
        const clearBytes = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
        if (rememberPassword) {
          savePassword(password);
        }
        document.open();
        document.write(decoder.decode(clearBytes));
        document.close();
      }

      if (!window.crypto || !crypto.subtle) {
        unlockButton.disabled = true;
        setError("Apri la pagina tramite HTTPS o localhost per usare lo sblocco.");
        return;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = passwordInput.value;
        unlockButton.disabled = true;
        setError("");
        try {
          await unlock(password, true);
        } catch (_) {
          forgetPassword();
          unlockButton.disabled = false;
          passwordInput.select();
          setError("Password non valida.");
        }
      });

      const savedPassword = getSavedPassword();
      if (savedPassword) {
        unlock(savedPassword, false).catch(() => forgetPassword());
      }
    })();
  </script>
