server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # HTML — no caching so updates appear immediately after each deploy.
    location ~* \.html?$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Sub-directories with their own index.html, e.g. "V. 1.0/IT/".
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Media is offloaded to S3+CloudFront and excluded from this image by
    # .dockerignore. CI rewrites these references to CDN URLs; if a request
    # still reaches nginx the rewrite failed, so return a real 404 rather than
    # letting the directory fallback serve an HTML page.
    location /_shared/ { return 404; }
    location /_assets/ { return 404; }
    location ~ /_images/  { return 404; }
    location ~ /_downloads/ { return 404; }

    # The "Download offline manual" button is built by JS at runtime against the page
    # origin, so it always resolves to this host — it cannot be rewritten in CI.
    # Redirect to the CDN so the download streams from CloudFront.
    # __CDN_BASE_URL__ is substituted in CI from the CDN_BASE_URL secret.
    # Note: nginx decodes %XX before matching `location =`, so the pattern must use
    # the *decoded* form (a literal space, quoted) — "/Offline%20manual.zip" would
    # never match, because the normalized URI contains a real space.
    location = "/Offline manual.zip" {
        return 302 __CDN_BASE_URL__/Offline%20manual.zip;
    }
}
